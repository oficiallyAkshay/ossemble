[project]
name = "ossemble"
version = "0.1.0"
requires-python = ">=3.11"
# Standard library only: the skill's script runs wherever the agent runs,
# nothing to resolve.
dependencies = []

[tool.uv]
# ossemble is an agent skill, not a built or published package; uv sync has
# nothing to build, so it must not require a build backend.
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "diff-cover==10.5.1",
    "pre-commit==4.6.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
# A builder repo (like ossemble itself) keeps unrendered template files
# under templates/ and a stamped fixture under examples/; neither is source
# ruff should lint. This keeps a whole-tree `ruff check .` or `ruff format
# .` from ever walking into either directory; templates/boot/ruff.toml
# covers the other half, a file under templates/boot/ passed to ruff
# directly, where ruff resolves config from that file's own directory
# upward and this exclude is never consulted.
extend-exclude = ["templates", "examples"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the ruff formatter
    "ISC001", # conflicts with the ruff formatter
    "T20", # the CLI and scripts print their output and status by design
    "D401", # every docstring here names a value, not a command; a deliberate house style
    "TRY003", # a failure is one formatted line on stderr, per the contract; the message is the exception's whole job, not a sign it needs its own subclass
    "EM", # same: the custom errors here exist only to carry that one-line message, raw or an f-string
    "PLC0415", # __main__ inserts sys.path before importing its siblings, and resume imports audit lazily so a broken audit module degrades one check, not every subcommand; both are documented where they happen
    "CPY", # the LICENSE file at the repo root covers this; no per-file copyright header convention here
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # assert is pytest's own idiom
    "ANN", # a test's signature does not need to be a documented interface
    "ARG001", # a pytest fixture is requested by name, not always used in the body
    "ARG005", # a monkeypatched stub matches the real signature; it does not have to use every part of it
    "PLR2004", # comparing against a literal is the point of a test assertion
    "D103", # a test's name is its documentation
    "D102", # same, for a test method on a test class
    "D104", # the tests package needs no docstring of its own
    "SLF001", # a test reaches into a private helper on purpose, to check it directly
    "S603", # a fixture shells out to the real git or gh to set up a throwaway repo
    "S607", # same: git and gh are fixed, trusted binary names here
]

[tool.coverage.run]
branch = true
source = ["scripts/ossemble"]

[tool.coverage.report]
fail_under = 100
