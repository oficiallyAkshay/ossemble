name: readme check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"

permissions: {}

# A second push to a pull request supersedes the first, so cancel the run it
# replaced. Pushes to main key on the commit instead, so a rapid second push
# gets its own group rather than dropping the first push's run.
concurrency:
  group: readme-check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  readmerlin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # exec runs the count-source commands from readmerlin.json (here,
      # tomllib against pyproject.toml) so every count badge is verified on
      # every push, not just parsed as a static string.
      - uses: oficiallyAkshay/readmerlin@df3c48aac7de0d30b21a0617e850c884731052b1 # v1.1.0
        with:
          exec: "true"
