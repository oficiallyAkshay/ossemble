[project]
name = "{{NAME}}"
version = "0.1.0"
requires-python = ">=3.11"
# Standard library only: the skill's script runs wherever the agent runs,
# nothing to resolve.
dependencies = []

[tool.uv]
# {{NAME}} is an agent skill, not a built or published package; uv sync has
# nothing to build, so it must not require a build backend.
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "diff-cover==10.5.1",
    "pre-commit==4.6.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the ruff formatter
    "ISC001", # conflicts with the ruff formatter
    "T20", # the CLI and scripts print their output and status by design
    "D401", # every docstring here names a value, not a command; a deliberate house style
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # assert is pytest's own idiom
    "ANN", # a test's signature does not need to be a documented interface
    "ARG001", # a pytest fixture is requested by name, not always used in the body
    "PLR2004", # comparing against a literal is the point of a test assertion
    "D103", # a test's name is its documentation
]

[tool.coverage.run]
branch = true
source = ["scripts/{{NAME}}"]

[tool.coverage.report]
fail_under = 100
