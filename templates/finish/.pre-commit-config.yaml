# The same hooks CI runs, run there through pre-commit like these. Ruff's
# version matches clonometer's pin; gitleaks, actionlint and zizmor are
# standalone tools pre-commit installs on its own and have no
# pyproject.toml pin to match.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # The upstream astral-sh/ty-pre-commit hook shells out to a `uv check`
  # preview command not every uv carries, so this runs ty straight from
  # the dev group instead, checking every file every run since a change to
  # one module can change the diagnostics for another.
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check scripts tests
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      # The default files pattern only covers .github/workflows; the
      # optional template sets ship their own copies of the same workflows
      # under templates/<set>/.github/workflows, and those never got linted.
      - id: actionlint
        files: ^(\.github/workflows/|templates/[^/]+/\.github/workflows/).*\.ya?ml$

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      # Same reasoning as actionlint above: extend the default files
      # pattern to also reach the template sets' workflow copies.
      - id: zizmor
        files: (^|/)(\.github/(workflows/[^/]+|dependabot)\.ya?ml|action\.ya?ml|\.pre-commit-(config|hooks)\.ya?ml)$|templates/[^/]+/\.github/workflows/[^/]+\.ya?ml$
