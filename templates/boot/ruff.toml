# templates/boot/pyproject.toml is a template, not a real project file: its
# fail_under line is an unquoted {{COVERAGE_FLOOR}} placeholder, so it is not
# valid TOML until scaffold renders it. Ruff resolves configuration for a
# file by walking up from that file's own directory, not from the repo
# root, so a top-level [tool.ruff] extend-exclude cannot stop it: it would
# still try to parse this template as its own config for anything under
# templates/boot/, including templates/boot/.github/pull_request_template.md,
# which pre-commit's ruff-format hook also formats (it covers markdown).
# An empty ruff.toml here becomes the nearest config instead, so ruff never
# reads the template. It is not part of the manifest and is never stamped
# into a target repo.
